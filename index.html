<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Private Inference Test</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="loginScreen">
    <h1>Private Inference Test</h1>
    <input type="password" id="passwordInput" placeholder="암호를 입력하세요" />
    <button id="loginBtn">확인</button>
    <p id="loginError" style="color:red; display:none;">암호가 올바르지 않습니다.</p>
  </div>

  <div id="mainContent" style="display:none;">
  <h1>Inference Test</h1>
  <p id="version" class="version-text">Version: loading...</p>

  <input type="file" id="fileInput" accept="image/*" />
  <div id="preview"></div>

  <button id="processBtn" disabled>Process</button>

  <p id="timer">Elapsed: 0.0s</p>
  <p id="status">서버 상태: 대기 중</p>
  <p id="note">※ 이미지를 업로드하면 서버로 전송해 inference 결과를 생성합니다. 지원 이미지 크기: 640 x 640</p>

  <h2>Results <a id="allDownloadBtn" href="#" style="display:none; font-size:0.85rem; font-weight:normal;">All Download</a></h2>
  <div id="results"></div>

  </div><!-- mainContent -->

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
