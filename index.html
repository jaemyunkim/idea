<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self'; img-src 'self' data: blob:; connect-src https://aiserv.sky.4pple.net; object-src 'none';" />
  <title>Private Inference Test</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="loginScreen">
    <div class="center-container">
      <div class="card-box">
        <div class="header">
          <h1 class="main">Welcome to Inference Test</h1>
          <div class="sub">Please enter your password below.</div>
        </div>
        <div class="content">
          <div class="login-form">
            <div class="field">
              <input id="passwordInput" class="password" type="password" placeholder="Password" autofocus autocomplete="current-password" />
              <button id="loginBtn" class="-button submit">Submit</button>
            </div>
            <p id="loginError" class="error" style="display:none;">Incorrect password.</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="mainContent" style="display:none;">
  <h1>Inference Test</h1>
  <p id="version" class="version-text">Version: loading...</p>
  <p id="note" class="note-text">※ 이미지를 업로드하면 서버로 전송해 inference 결과를 생성합니다. 지원 이미지 크기: 640 x 640</p>

  <input type="file" id="fileInput" accept="image/*" />
  <button id="processBtn" disabled>Process</button>

  <div id="preview"></div>

  <h2>Server Response</h2>
  <p id="timer">Elapsed: 0.0s</p>
  <p id="status">서버 상태: 대기 중</p>
  <div id="jobInfo" style="display:none;"></div>

  <h2>Results <a id="allDownloadBtn" href="#" style="display:none; font-size:0.85rem; font-weight:normal;">All Download</a></h2>
  <div id="results"></div>

  </div><!-- mainContent -->

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" integrity="sha512-XMVd28F1oH/O71fzwBnV7HucLxVwtxf26XV8P4wPk26EDxuGZ91N8bsOttmnomcCD3CS5ZMRL50H0GgOHvegtg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="app.js"></script>
</body>
</html>
